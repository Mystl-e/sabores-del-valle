{% extends 'base.html' %}

{% block titulo %}Iniciar sesión{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-3"><i class="bi bi-box-arrow-in-right"></i> Iniciar sesión</h1>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include 'includes/form_campos.html' %}
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-vino w-100">Ingresar</button>
                </form>
                <p class="text-center small mt-3 mb-0">
                    ¿No tienes cuenta? <a href="{% url 'usuarios:registro' %}">Regístrate aquí</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
