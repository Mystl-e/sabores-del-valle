{% extends 'base.html' %}

{% block titulo %}Crear cuenta{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-3"><i class="bi bi-person-plus"></i> Crear cuenta</h1>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include 'includes/form_campos.html' %}
                    <button type="submit" class="btn btn-vino w-100">Registrarme</button>
                </form>
                <p class="text-center small mt-3 mb-0">
                    ¿Ya tienes cuenta? <a href="{% url 'usuarios:login' %}">Inicia sesión</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
