{% extends 'base.html' %}

{% block titulo %}{{ titulo }}{% endblock %}

{% block contenido %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'catering:gestion' %}">Gestión</a></li>
        <li class="breadcrumb-item active" aria-current="page">{{ titulo }}</li>
    </ol>
</nav>

<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-3">{{ titulo }}</h1>

                {% if servicio.imagen %}
                <div class="mb-3">
                    <p class="small text-muted mb-1">Imagen actual</p>
                    <img src="{{ servicio.imagen.url }}" alt="{{ servicio.nombre }}" class="img-thumbnail" style="max-height: 160px;">
                </div>
                {% endif %}

                <!-- multipart/form-data: obligatorio para enviar archivos (request.FILES) -->
                <form method="post" enctype="multipart/form-data" novalidate>
                    {% csrf_token %}
                    {% include 'includes/form_campos.html' %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-vino"><i class="bi bi-save"></i> Guardar</button>
                        <a href="{% url 'catering:gestion' %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
